name: Firefox extension

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["extension/**", "shared/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["extension/**", "shared/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Sign with addons.mozilla.org (unlisted, optional)
        if: startsWith(github.ref, 'refs/tags/v') && env.AMO_JWT_ISSUER != ''
        run: >
          npx web-ext sign --channel unlisted --artifacts-dir dist
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          --ignore-files package.json package-lock.json scripts node_modules dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkdb-extension
          path: extension/dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension/dist/*.zip
            extension/dist/*.xpi
            docker-compose.yml
            .env.example
